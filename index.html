<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本統計ダッシュボード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;padding:24px;max-width:1000px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cat-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid #d0cfc8;background:#fff;color:#666;cursor:pointer;transition:all .15s}
.cat-btn.active{background:#185FA5;color:#fff;border-color:#185FA5;font-weight:600}
.period-btns{display:flex;gap:4px}
.period-btn{font-size:12px;padding:4px 10px;border-radius:16px;border:1px solid #d0cfc8;background:#fff;color:#666;cursor:pointer}
.period-btn.active{background:#185FA5;color:#fff;border-color:#185FA5}
button.dl{font-size:12px;padding:5px 12px;border:1px solid #d0cfc8;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:4px}
button.dl:hover{background:#f0f0ee}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.mc{background:#fff;border-radius:10px;border:1px solid #e8e8e4;padding:12px 14px}
.ml{font-size:11px;color:#888;margin-bottom:4px}
.mv{font-size:20px;font-weight:600;color:#1a1a1a}
.ms{font-size:11px;color:#aaa;margin-top:2px}
.chart-wrap{background:#fff;border-radius:12px;border:1px solid #e8e8e4;padding:16px;margin-bottom:12px}
.chart-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.chart-title{font-size:14px;font-weight:600}
.src{font-size:11px;color:#185FA5;text-decoration:none}
.src:hover{text-decoration:underline}
.compare{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cmp-item{font-size:12px;padding:4px 10px;border:1px solid #d0cfc8;border-radius:16px;cursor:pointer;background:#fff;color:#666}
.cmp-item.active{background:#E6F1FB;color:#0C447C;border-color:#85B7EB;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#666;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:4px}
.ld{width:10px;height:10px;border-radius:2px;display:inline-block}
.ai-box{background:#fff;border-radius:12px;border:1px solid #e8e8e4;padding:14px}
.ai-lbl{font-size:11px;color:#aaa;margin-bottom:6px}
.ai-text{font-size:13px;color:#1a1a1a;line-height:1.7}
.ai-loading{color:#aaa;font-style:italic}
</style>
</head>
<body>
<h1>📊 日本統計ダッシュボード</h1>

<div class="controls">
  <div class="period-btns">
    <button class="period-btn" onclick="setPeriod(5)">5年</button>
    <button class="period-btn" onclick="setPeriod(10)">10年</button>
    <button class="period-btn active" onclick="setPeriod(20)">20年</button>
    <button class="period-btn" onclick="setPeriod(30)">30年</button>
  </div>
  <button class="dl" onclick="downloadCSV()">⬇ CSV書き出し</button>
</div>

<div class="cats" id="cats"></div>
<div class="metrics" id="metrics"></div>

<div class="chart-wrap">
  <div class="chart-hdr">
    <span class="chart-title" id="chartTitle">指標を選択してください</span>
    <a class="src" id="sourceLink" href="#" target="_blank">↗ データソース</a>
  </div>
  <div class="compare" id="compareToggle"></div>
  <div class="legend" id="legend"></div>
  <div style="position:relative;width:100%;height:300px">
    <canvas id="mainChart"></canvas>
  </div>
</div>

<div class="ai-box">
  <div class="ai-lbl">✦ AI解説（Claude）</div>
  <div class="ai-text ai-loading" id="aiText">指標を選択すると、AIが分析・解説します。</div>
</div>

      unit_cost:{label:"建築費単価",unit:"万円/㎡",data:{2000:17.2,2001:17.0,2002:16.8,2003:16.5,2004:16.6,2005:16.8,2006:17.0,2007:17.5,2008:18.2,2009:18.0,2010:17.8,2011:17.9,2012:18.2,2013:19.5,2014:21.8,2015:22.5,2016:23.0,2017:23.8,2018:24.5,2019:25.2,2020:25.8,2021:26.5,2022:29.0,2023:32.5}},
      condo_price:{label:"首都圏新築分譲価格",unit:"万円",data:{2000:3716,2001:3543,2002:3448,2003:3311,2004:3352,2005:3488,2006:3724,2007:4001,2008:4235,2009:4047,2010:4295,2011:4158,2012:4254,2013:4929,2014:5060,2015:5518,2016:5490,2017:5908,2018:5871,2019:5980,2020:6083,2021:6360,2022:6288,2023:7565}}

  },
  trade:{
    label:"貿易・輸出入",color:"#BA7517",
    source:"https://www.customs.go.jp/toukei/suii/html/time.htm",sourceLabel:"財務省貿易統計",
    metrics:[
      {key:"exports",label:"輸出額（兆円）"},
      {key:"imports",label:"輸入額（兆円）"},
      {key:"balance",label:"貿易収支（兆円）"},
    ],
    series:{
      exports:{label:"輸出額",unit:"兆円",data:{2000:51.7,2001:48.9,2002:52.1,2003:54.5,2004:61.2,2005:65.7,2006:75.2,2007:83.9,2008:81.0,2009:54.2,2010:67.4,2011:65.5,2012:63.7,2013:69.8,2014:73.1,2015:75.6,2016:70.0,2017:78.3,2018:81.5,2019:76.9,2020:68.4,2021:83.1,2022:98.2,2023:100.9}},
      imports:{label:"輸入額",unit:"兆円",data:{2000:40.9,2001:42.4,2002:42.2,2003:44.4,2004:49.2,2005:56.9,2006:67.3,2007:73.1,2008:78.9,2009:51.5,2010:60.8,2011:68.1,2012:70.7,2013:81.2,2014:85.9,2015:78.4,2016:66.0,2017:75.4,2018:82.7,2019:78.6,2020:68.0,2021:84.4,2022:118.1,2023:110.0}},

  },
  gdp:{
    label:"経済・GDP",color:"#3B6D11",
    source:"https://www.esri.cao.go.jp/jp/sna/menu.html",sourceLabel:"内閣府国民経済計算",

    ],

      gdp_growth:{label:"実質GDP成長率",unit:"%",data:{2000:2.8,2001:0.4,2002:0.1,2003:1.5,2004:2.2,2005:1.7,2006:1.4,2007:1.3,2008:-1.1,2009:-5.4,2010:4.1,2011:-0.1,2012:1.5,2013:2.0,2014:-0.4,2015:1.2,2016:0.8,2017:1.7,2018:0.6,2019:-0.4,2020:-4.1,2021:2.1,2022:1.0,2023:1.9}},
      gdp_per:{label:"一人当たりGDP",unit:"万円",data:{2000:419,2001:414,2002:410,2003:412,2004:417,2005:421,2006:425,2007:426,2008:420,2009:383,2010:395,2011:390,2012:391,2013:405,2014:410,2015:425,2016:427,2017:437,2018:440,2019:441,2020:427,2021:442,2022:474,2023:476}}
    }
  }
};

const COLORS = ["#185FA5","#D85A30","#1D9E75","#7F77DD","#BA7517"];
let currentCat = 'population';
let activeSeries = [];
let periodYears = 20;
let chart = null;

function setPeriod(y){
  periodYears = y;
  document.querySelectorAll('.period-btn').forEach((b,i)=>{
    b.classList.toggle('active',[5,10,20,30][i]===y);
  });
  renderChart();
}

function filterYears(data){
  const minY = 2024 - periodYears;
  const out = {};
  Object.keys(data).forEach(y=>{ if(+y>=minY) out[y]=data[y]; });
  return out;
}

function renderCategories(){
  const c = document.getElementById('cats');
  c.innerHTML = Object.entries(DATA).map(([k,v])=>
    `<button class="cat-btn${k===currentCat?' active':''}" onclick="selectCat('${k}')">${v.label}</button>`
  ).join('');
}

function selectCat(key){
  currentCat = key;
  activeSeries = [Object.keys(DATA[key].series)[0]];
  renderCategories();
  renderMetrics();
  renderCompare();
  renderChart();
  renderAI();
}

function renderMetrics(){
  const cat = DATA[currentCat];
  const m = document.getElementById('metrics');
  m.innerHTML = cat.metrics.map(mt=>{
    const s = cat.series[mt.key];
    const vals = Object.values(s.data);
    const latest = vals[vals.length-1];
    const prev = vals[vals.length-2];
    const diff = (latest - prev).toFixed(1);
    const sign = diff > 0 ? '+' : '';
    return `<div class="mc"><div class="ml">${mt.label}</div><div class="mv">${latest.toLocaleString()}</div><div class="ms">${sign}${diff}（前年）</div></div>`;
  }).join('');
}

function renderCompare(){
  const cat = DATA[currentCat];
  const tog = document.getElementById('compareToggle');
  tog.innerHTML = Object.entries(cat.series).map(([k,s])=>
    `<div class="cmp-item${activeSeries.includes(k)?' active':''}" onclick="toggleSeries('${k}')">${s.label}</div>`
  ).join('');
}

function toggleSeries(key){
  if(activeSeries.includes(key)){
    if(activeSeries.length>1) activeSeries = activeSeries.filter(k=>k!==key);
  } else {
    activeSeries.push(key);
  }
  renderCompare();
  renderChart();
}

function renderChart(){
  const cat = DATA[currentCat];
  document.getElementById('chartTitle').textContent = cat.label + ' — ' + activeSeries.map(k=>cat.series[k].label).join('・');
  const sl = document.getElementById('sourceLink');
  sl.href = cat.source;
  sl.textContent = '↗ ' + cat.sourceLabel;

  const allYears = new Set();
  activeSeries.forEach(k=>{
    Object.keys(filterYears(cat.series[k].data)).forEach(y=>allYears.add(y));
  });
  const labels = [...allYears].sort();

  const datasets = activeSeries.map((k,i)=>{
    const s = cat.series[k];
    const filtered = filterYears(s.data);
    return {
      label: s.label,
      data: labels.map(y=>filtered[y]??null),
      borderColor: COLORS[i%COLORS.length],
      backgroundColor: COLORS[i%COLORS.length]+'22',
      borderWidth: 2.5,
      pointRadius: 3,
      tension: 0.3,
      fill: activeSeries.length===1
    };
  });

  document.getElementById('legend').innerHTML = datasets.map((d,i)=>
    `<span><span class="ld" style="background:${COLORS[i%COLORS.length]}"></span>${d.label}</span>`
  ).join('');

  if(chart) chart.destroy();
  chart = new Chart(document.getElementById('mainChart'),{
    type:'line',
    data:{labels, datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{size:11},maxRotation:45,color:'#888'}},
        y:{grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{size:11},color:'#888'}}
      }
    }
  });
}

async function renderAI(){
  const cat = DATA[currentCat];
  const el = document.getElementById('aiText');
  el.classList.add('ai-loading');
  el.textContent = '解析中...';
  const seriesInfo = activeSeries.map(k=>{
    const s = cat.series[k];
    const vals = Object.entries(s.data);
    const recent = vals.slice(-5).map(([y,v])=>`${y}年:${v}`).join(', ');
    return `${s.label}（${s.unit}）: 最近5年=${recent}`;
  }).join('\n');
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:`あなたは日本の統計データの専門家です。以下のデータを見て、120文字程度で簡潔にトレンドと注目ポイントを日本語で解説してください。箇条書き不要、2〜3文で。\n\nカテゴリ: ${cat.label}\n${seriesInfo}`}]
      })
    });
    const data = await resp.json();
    const text = data.content?.filter(b=>b.type==='text').map(b=>b.text).join('') || '解説を取得できませんでした。';
    el.classList.remove('ai-loading');
    el.textContent = text;
  } catch(e) {
    el.classList.remove('ai-loading');
    el.textContent = 'AI解説の取得に失敗しました。';
  }
}

function downloadCSV(){
  const cat = DATA[currentCat];
  const allYears = new Set();
  activeSeries.forEach(k=>Object.keys(cat.series[k].data).forEach(y=>allYears.add(y)));
  const years = [...allYears].sort();
  const header = ['年度',...activeSeries.map(k=>cat.series[k].label)].join(',');
  const rows = years.map(y=>[y,...activeSeries.map(k=>cat.series[k].data[y]??'')].join(','));
  const csv = [header,...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download = `japan_stats_${currentCat}.csv`;
  a.click();
}

selectCat('population');
</script>
</body>
</html>
