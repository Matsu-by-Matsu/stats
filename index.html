<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本統計ダッシュボード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#f7f6f3;--sur:#fff;--bdr:#e5e3dc;--txt:#1a1917;--mut:#6b6a66;--hnt:#a8a7a2;--blue:#185FA5;--blt:#E6F1FB;--red:#D85A30;--grn:#1D9E75;--pur:#7F77DD;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding:20px}
h1{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
h1 em{color:var(--blue);font-style:normal}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.prow{display:flex;gap:4px}
.pb{font-size:11px;padding:4px 10px;border-radius:16px;border:1px solid var(--bdr);background:var(--sur);color:var(--mut);cursor:pointer}
.pb.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.rbtns{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.cmpbtn{font-size:11px;padding:4px 10px;border-radius:16px;border:1px solid var(--bdr);background:var(--sur);color:var(--mut);cursor:pointer}
.cmpbtn.on{background:#E24B4A;color:#fff;border-color:#E24B4A}
.ib{font-size:11px;padding:4px 10px;border-radius:16px;border:1px solid var(--bdr);background:var(--sur);color:var(--mut);cursor:pointer}
.ib.on{background:#1a1917;color:#fff;border-color:#1a1917}
.dlb,.updbtn{font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--bdr);background:var(--sur);color:var(--mut);cursor:pointer}
.updbtn{border-color:#0F6E56;color:#0F6E56;font-weight:600}
.updbtn:hover{background:#0F6E56;color:#fff}
.updbtn.loading{opacity:.6;cursor:wait}
.cats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.cbtn{font-size:12px;padding:5px 13px;border-radius:20px;border:1px solid var(--bdr);background:var(--sur);color:var(--mut);cursor:pointer;white-space:nowrap;transition:.1s}
.cbtn.on{color:#fff;border-color:transparent;font-weight:600}
.panel{display:none;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;margin-bottom:10px}
.panel.show{display:block}
.ptitle{font-size:11px;color:var(--mut);margin-bottom:8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.pref-chips{display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow-y:auto}
.pchip{font-size:11px;padding:3px 8px;border-radius:12px;border:1px solid var(--bdr);background:var(--sur);color:var(--mut);cursor:pointer;transition:.1s;white-space:nowrap}
.pchip.on{color:#fff;border-color:transparent;font-weight:600}
.hint{font-size:10px;color:var(--hnt);margin-top:6px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.mc{background:var(--sur);border-radius:var(--r);border:1.5px solid var(--bdr);padding:11px 13px;cursor:pointer;transition:.1s}
.mc:hover{border-color:#999}
.mc.on{border-color:var(--blue);background:var(--blt)}
.mc.cmp{border-color:#E24B4A;background:#FEF0EE}
.ml{font-size:10px;color:var(--mut);margin-bottom:3px}
.mv{font-size:18px;font-weight:700}
.ms{font-size:10px;margin-top:2px}
.ms.up{color:var(--grn)}.ms.dn{color:var(--red)}.ms.fl{color:var(--hnt)}
.live-badge{font-size:9px;background:#0F6E56;color:#fff;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}
.cw{background:var(--sur);border-radius:var(--r);border:1px solid var(--bdr);padding:16px;margin-bottom:10px}
.chdr{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ctit{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.src{font-size:10px;color:var(--blue);text-decoration:none}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);margin-bottom:8px}
.leg span{display:flex;align-items:center;gap:4px}
.ld{width:10px;height:10px;border-radius:2px;display:inline-block;flex-shrink:0}
.cmp-note{font-size:11px;color:#E24B4A;margin-bottom:6px;display:none}
.cmp-note.show{display:block}
.last-upd{font-size:10px;color:var(--hnt);margin-top:4px}
.aib{background:var(--sur);border-radius:var(--r);border:1px solid var(--bdr);padding:14px}
.ailt{font-size:10px;color:var(--hnt);margin-bottom:5px}
.ailt::before{content:"✦ ";color:var(--pur)}
.ait{font-size:13px;color:var(--txt);line-height:1.7}
.ail{color:var(--hnt);font-style:italic}
</style>
</head>
<body>
<div class="wrap">
<h1>📊 日本統計 <em>ダッシュボード</em></h1>
<div class="top">
  <div class="prow" id="prow"></div>
  <div class="rbtns">
    <button class="updbtn" id="updBtn" onclick="fetchLatest()">🔄 最新データ取得</button>
    <button class="cmpbtn" id="cmpBtn" onclick="toggleCompare()">＋ 比較モード</button>
    <button class="ib" id="idxBtn" onclick="toggleIndex()">基準年=100</button>
    <button class="dlb" onclick="dlCSV()">⬇ CSV</button>
  </div>
</div>
<div class="cats" id="cats"></div>
<div class="panel" id="prefPanel">
  <div class="ptitle"><span id="prefPanelTitle"></span><span id="prefCount" style="font-weight:400;color:var(--hnt)"></span></div>
  <div class="pref-chips" id="prefChips"></div>
  <div class="hint" id="prefHint"></div>
</div>
<div class="metrics" id="metrics"></div>
<div class="cw">
  <div class="chdr">
    <span class="ctit" id="ctit">カテゴリを選択</span>
    <a class="src" id="srcLink" href="#" target="_blank">↗ データソース</a>
  </div>
  <div class="cmp-note" id="cmpNote">比較モード：指標カードをクリックして複数選択</div>
  <div class="leg" id="leg"></div>
  <div style="position:relative;width:100%;height:300px">
    <canvas id="mc" role="img" aria-label="統計グラフ">統計データ</canvas>
  </div>
  <div class="last-upd" id="lastUpd"></div>
</div>

<div class="cw" id="prefChartWrap" style="margin-top:10px">
  <div class="chdr">
    <span class="ctit" id="prefCtit"></span>
  </div>
  <div class="leg" id="prefLeg"></div>
  <div id="prefCanvasWrap" style="position:relative;width:100%;height:260px;display:none">
    <canvas id="prefChart" role="img" aria-label="都道府県別比較グラフ">都道府県別データ</canvas>
  </div>
</div>
<div class="aib">
  <div class="ailt">AI解説（Claude）</div>
  <div class="ait ail" id="ait">カテゴリを選択するとAIが解説します。</div>
</div>
</div>

// ===================== RENDER =====================
function renderCats(){
  document.getElementById('cats').innerHTML=Object.entries(DATA).map(([k,v])=>{
    const live=v.isLive?'<span class="live-badge">LIVE</span>':'';
    return `<button class="cbtn${k===cat?' on':''}" id="cat_${k}" style="${k===cat?'background:'+v.color+';border-color:'+v.color:''}" onclick="selectCat('${k}')">${v.label}${live}</button>`;
  }).join('');
}

function selectCat(k){
  cat=k; compareMode=false; compareKeys=[];
  activeKey=Object.keys(DATA[k].series)[0];
  selectedPrefs=DATA[k].prefType==='population'?['全国']:DATA[k].prefType==='tourism'?['全国（合計）']:[];
  document.getElementById('cmpBtn').classList.remove('on');
  document.getElementById('cmpNote').classList.remove('show');
  renderCats();
  renderPrefPanel();
  renderMetrics();
  renderChart();
  renderPrefChart();
  renderAI();
}

function renderPrefPanel(){
  const d=DATA[cat];
  const panel=document.getElementById('prefPanel');
  if(!d.hasPref){panel.classList.remove('show');return;}
  panel.classList.add('show');
  const pool=d.prefType==='population'?PREF_POP:PREF_TOURISM;
  window._prefPool=pool;
  window._prefList=Object.keys(pool);
  const maxSel=10;
  document.getElementById('prefPanelTitle').textContent=d.prefType==='tourism'?'都道府県別 宿泊者数（万泊）':'都道府県別人口（万人）';
  document.getElementById('prefCount').textContent=selectedPrefs.length+'/'+maxSel+'件選択中';
  let html='';
  window._prefList.forEach(function(p,i){
    const on=selectedPrefs.indexOf(p)>=0;
    const bg=on?'background:'+DATA[cat].color+';border-color:'+DATA[cat].color+';color:#fff':'';
    html+='<button class="pchip'+(on?' on':'')+'" style="'+bg+'" onclick="togglePrefIdx('+i+')">'+p+'</button>';
  });
  document.getElementById('prefChips').innerHTML=html;
  document.getElementById('prefHint').textContent=selectedPrefs.length>=maxSel?'上限10件に達しました':'クリックで選択・解除。複数選択で比較。';
}

function togglePrefIdx(i){
  const p=window._prefList[i];
  togglePref(p);
}

function togglePref(p){
  const isAll=p==='全国'||p==='全国（合計）';
  const idx=selectedPrefs.indexOf(p);
  if(idx>=0){
    if(selectedPrefs.length>1) selectedPrefs.splice(idx,1);
  } else {
    if(isAll){
      selectedPrefs=['全国（合計）'===p?'全国（合計）':'全国'];
    } else {
      selectedPrefs=selectedPrefs.filter(function(x){return x!=='全国'&&x!=='全国（合計）';});
      if(selectedPrefs.length>=10) return;
      selectedPrefs.push(p);
    }
  }
  renderPrefPanel();
  renderPrefChart();
}


function renderMetrics(){
  const d=DATA[cat];
  document.getElementById('metrics').innerHTML=d.metrics.map(m=>{
    const s=d.series[m.key];
    const vals=Object.values(s.data);
    const latest=vals[vals.length-1];
    const prev=vals[vals.length-2]||latest;
    const diff=+(latest-prev).toFixed(2);
    const sign=diff>0?'+':'';
    const cls=diff>0?'up':diff<0?'dn':'fl';
    let extra='';
    if(compareMode) extra=compareKeys.includes(m.key)?' cmp':'';
    else extra=activeKey===m.key?' on':'';
    return `<div class="mc${extra}" onclick="clickMetric('${m.key}')">
      <div class="ml">${m.label}</div>
      <div class="mv">${typeof latest==='number'&&latest>999?latest.toLocaleString():latest}</div>
      <div class="ms ${cls}">${sign}${diff}（前期比）</div>
    </div>`;
  }).join('');
}

function clickMetric(key){
  if(compareMode){
    if(compareKeys.includes(key)){if(compareKeys.length>1)compareKeys=compareKeys.filter(k=>k!==key);}
    else compareKeys.push(key);
  } else {
    activeKey=key;
    renderAI();
  }
  renderMetrics();
  renderChart();
}

function toggleCompare(){
  compareMode=!compareMode;
  document.getElementById('cmpBtn').classList.toggle('on',compareMode);
  document.getElementById('cmpNote').classList.toggle('show',compareMode);
  if(compareMode) compareKeys=activeKey?[activeKey]:[];
  else compareKeys=[];
  renderMetrics();
  renderChart();
}

function toggleIndex(){
  indexMode=!indexMode;
  document.getElementById('idxBtn').classList.toggle('on',indexMode);
  renderChart();
}

function setPeriod(p){
  period=p;
  document.querySelectorAll('.pb').forEach((b,i)=>b.classList.toggle('on',PERIODS[i]===p));
  renderChart();
}

function filterYears(data){
  const keys=Object.keys(data).sort();
  const minY=2026-period;
  const out={};
  keys.forEach(k=>{if(parseFloat(k)>=minY)out[k]=data[k];});
  return out;
}

function applyIdx(data){
  const vals=Object.values(data);
  if(!vals.length||!vals[0]) return data;
  const base=vals[0]; const out={};
  Object.keys(data).forEach(y=>out[y]=+(data[y]/base*100).toFixed(1));
  return out;
}


var prefChart=null;
function renderPrefChart(){
  const d = DATA[cat];
  const canvasWrap = document.getElementById('prefCanvasWrap');
  if(!d.hasPref || selectedPrefs.length === 0){
    canvasWrap.style.display = 'none';
    if(prefChart){ prefChart.destroy(); prefChart = null; }
    return;
  }
  const pool = d.prefType === 'population' ? PREF_POP : PREF_TOURISM;
  const unit = d.prefType === 'population' ? '万人' : '万泊';
  const titleText = d.prefType === 'tourism' ? '都道府県別 宿泊者数（万泊）' : '都道府県別人口（万人）';

  // ラベル（年）収集
  const allY = new Set();
  for(let i=0; i<selectedPrefs.length; i++){
    const obj = pool[selectedPrefs[i]] || {};
    const filtered = filterYears(obj);
    Object.keys(filtered).forEach(function(y){ allY.add(y); });
  }
  const labels = Array.from(allY).sort();

  if(labels.length === 0){
    canvasWrap.style.display = 'none';
    return;
  }

  // datasets
  const cols = ['#185FA5','#D85A30','#1D9E75','#7F77DD','#BA7517','#0F6E56','#E24B4A','#534AB7','#3B6D11','#993556'];
  const datasets = [];
  for(let i=0; i<selectedPrefs.length; i++){
    const p = selectedPrefs[i];
    const obj = pool[p] || {};
    let fd = filterYears(obj);
    if(indexMode) fd = applyIdx(fd);
    datasets.push({
      label: p,
      data: labels.map(function(y){ return fd[y] !== undefined ? fd[y] : null; }),
      borderColor: cols[i % cols.length],
      backgroundColor: cols[i % cols.length] + '22',
      borderWidth: 2,
      pointRadius: 3,
      tension: 0.3,
      fill: false
    });
  }

  // 凡例
  document.getElementById('prefCtit').textContent = titleText;
  let legHtml = '';
  for(let i=0; i<datasets.length; i++){
    legHtml += '<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mut)">'
      + '<span style="width:10px;height:10px;border-radius:2px;background:' + datasets[i].borderColor + ';display:inline-block"></span>'
      + datasets[i].label + '（' + unit + '）</span>';
  }
  document.getElementById('prefLeg').innerHTML = legHtml;

  // canvasを表示してからChart生成
  canvasWrap.style.display = 'block';
  // 既存インスタンスを確実に破棄
  const existingChart = Chart.getChart('prefChart');
  if(existingChart) existingChart.destroy();
  if(prefChart){ prefChart.destroy(); prefChart = null; }
  prefChart = new Chart(document.getElementById('prefChart'), {
    type: 'line',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(ctx){
          return ' ' + ctx.dataset.label + ': ' + (ctx.parsed.y || 0).toLocaleString() + unit;
        }}}
      },
      scales: {
        x: { grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 11 }, maxRotation: 50, color: '#888' } },
        y: { grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 11 }, color: '#888', callback: function(v){ return v.toLocaleString(); } },
          title: { display: true, text: unit, font: { size: 10 }, color: '#888' } }
      }
    }
  });
}

function renderChart(){
  const d=DATA[cat];
  const isPref=d.hasPref;
  const pool=d.prefType==='population'?PREF_POP:PREF_TOURISM;
  const keys=compareMode?compareKeys:(activeKey?[activeKey]:[]);
  if(!keys.length){if(chart)chart.destroy();return;}

  // メインチャートのY軸はd.seriesのみ
  const allY=new Set();
  keys.forEach(k=>Object.keys(filterYears(d.series[k].data)).forEach(y=>allY.add(y)));
  const labels=[...allY].sort();

  // メインチャートは常にd.series[k].dataを使用。都道府県パネルはサブチャート専用
  const datasets=[];
  let ci=0;
  keys.forEach((k,i)=>{
    const s=d.series[k];
    let fd=filterYears(s.data);
    if(indexMode) fd=applyIdx(fd);
    const col=C[ci++%C.length];
    const yAxis=compareMode&&i===1&&d.series[keys[0]].unit!==s.unit?'y2':'y';
    datasets.push({label:s.label,data:labels.map(y=>fd[y]??null),borderColor:col,backgroundColor:col+'18',borderWidth:2,pointRadius:3,tension:0.3,yAxisID:yAxis,fill:datasets.length===0&&keys.length===1});
  });

  document.getElementById('leg').innerHTML=datasets.map((ds,i)=>{
    const k=keys[Math.min(i,keys.length-1)];
    const unit=indexMode?'指数':(DATA[cat].series[k]?.unit||'');
    return `<span><span class="ld" style="background:${ds.borderColor}"></span>${ds.label}（${unit}）${ds.yAxisID==='y2'?' ← 右軸':''}</span>`;
  }).join('');

  const u0=d.series[keys[0]]?.unit||'';
  const u1=keys[1]?d.series[keys[1]]?.unit||'':'';
  const needDual=compareMode&&keys[1]&&u0!==u1;
  const scales={
    x:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:11},maxRotation:50,color:'#888',autoSkip:labels.length>20}},
    y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:11},color:'#888',callback:v=>typeof v==='number'&&v>999?v.toLocaleString():v},
      title:{display:true,text:indexMode?'指数(100=基準)':u0,font:{size:10},color:'#888'}}
  };
  if(needDual) scales.y2={position:'right',grid:{drawOnChartArea:false},ticks:{font:{size:11},color:C[1]},title:{display:true,text:indexMode?'指数':u1,font:{size:10},color:C[1]}};

  const titleText=d.label+(compareMode&&keys.length>1?` — ${keys.map(k=>d.series[k].label).join(' vs ')}`:(keys.length===1?` — ${d.series[keys[0]].label}`:''))+(indexMode?' （基準年=100）':'');
  document.getElementById('ctit').textContent=titleText;
  const isLive=d.isLive;
  if(isLive){
    const badge=document.createElement('span');
    badge.className='live-badge';badge.textContent='LIVE';
    const el=document.getElementById('ctit');
    if(!el.querySelector('.live-badge')) el.appendChild(badge);
  }
  document.getElementById('srcLink').href=d.source;
  document.getElementById('srcLink').textContent='↗ '+d.srcLbl;

  const upd=lastUpdated[cat];
  document.getElementById('lastUpd').textContent=upd?`最終更新: ${upd}`:(isLive?'🔄 最新データ取得ボタンで更新できます':'');

  if(chart) chart.destroy();
  chart=new Chart(document.getElementById('mc'),{
    type:'line',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{
        const ki=keys[Math.min(ctx.datasetIndex,keys.length-1)];
        const unit=indexMode?'':(DATA[cat].series[ki]?.unit||'');
        const v=ctx.parsed.y;
        return ` ${ctx.dataset.label}: ${typeof v==='number'&&v>999?v.toLocaleString():v}${unit}`;
      }}}},
      scales}
  });
}

// ===================== LIVE UPDATE =====================
async function fetchLatest(){
  const btn=document.getElementById('updBtn');
  btn.classList.add('loading'); btn.textContent='🔄 取得中...';
  const d=DATA[cat];
  const prompt=`あなたは金融データの専門家です。以下の指標の最新値を調べてJSON形式のみで返してください。他のテキストは不要です。
カテゴリ: ${d.label}
指標: ${Object.entries(d.series).map(([k,s])=>`${k}(${s.label},${s.unit})`).join(', ')}
必要情報: 各指標の直近の実績値または市場値（年次または月次）
出力形式: {"updates":{"指標key":"値(数値のみ)","as_of":"YYYY-MM"}, "summary":"50字以内の状況説明"}
現在日: 2026年6月4日`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:600,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:prompt}]
      })
    });
    const data=await resp.json();
    const textBlocks=data.content?.filter(b=>b.type==='text').map(b=>b.text).join('');
    try{
      const clean=textBlocks.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(clean);
      if(parsed.updates){
        const asOf=parsed.as_of||parsed.updates.as_of;
        Object.entries(parsed.updates).forEach(([k,v])=>{
          if(DATA[cat].series[k] && typeof v==='number'){
            DATA[cat].series[k].data['最新']=v;
          }
        });
        const now=new Date().toLocaleDateString('ja-JP');
        lastUpdated[cat]=now+(asOf?` (${asOf}時点)`:'');
        if(parsed.summary){
          document.getElementById('ait').className='ait';
          document.getElementById('ait').textContent=parsed.summary;
        }
        renderMetrics();
        renderChart();
      }
    }catch(e){
      document.getElementById('ait').className='ait';
      document.getElementById('ait').textContent=textBlocks?.slice(0,200)||'データ取得完了（解析エラー）';
    }
  }catch(e){
    document.getElementById('ait').className='ait';
    document.getElementById('ait').textContent='通信エラーが発生しました。';
  }
  btn.classList.remove('loading'); btn.textContent='🔄 最新データ取得';
}

async function renderAI(){
  const d=DATA[cat];
  const el=document.getElementById('ait');
  el.className='ait ail'; el.textContent='解析中...';
  const k=activeKey||Object.keys(d.series)[0];
  const s=d.series[k];
  const vals=Object.entries(s.data).slice(-5).map(([y,v])=>`${y}年:${v}`).join(', ');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,
        messages:[{role:'user',content:`日本統計の専門家として、以下データのトレンドと注目ポイントを120文字程度で日本語解説（箇条書き不要、2〜3文）。\nカテゴリ:${d.label} 指標:${s.label}（${s.unit}）\n最近データ: ${vals}`}]})
    });
    const data=await r.json();
    const t=data.content?.filter(b=>b.type==='text').map(b=>b.text).join('')||'解説取得失敗';
    el.className='ait'; el.textContent=t;
  }catch(e){el.className='ait';el.textContent='AI解説の取得に失敗しました。';}
}

function dlCSV(){
  const d=DATA[cat];
  const keys=compareMode?compareKeys:[activeKey];
  const allY=new Set();
  keys.forEach(k=>Object.keys(d.series[k].data).forEach(y=>allY.add(y)));
  const years=[...allY].sort();
  const hdr=['年度',...keys.map(k=>d.series[k].label)].join(',');
  const rows=years.map(y=>[y,...keys.map(k=>d.series[k].data[y]??'')].join(','));
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent([hdr,...rows].join('\n'));
  a.download=`japan_stats_${cat}.csv`; a.click();
}
